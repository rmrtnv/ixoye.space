name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Remove git directory for clean copy
        run: rm -rf .git

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
      - name: Sync website files to server
        run: |
          rsync -avz --exclude='.git' --exclude='.github' --exclude='xray' --exclude='docker-compose.yml' \
            -e "ssh -o StrictHostKeyChecking=no -p ${{ secrets.SSH_PORT }}" \
            ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/app/www/
          
      - name: Deploy with Xray Reality and Web Server
        run: |
          ssh -o StrictHostKeyChecking=no -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} 'bash -s' << 'ENDSSH'
            set -e
            cd /opt/app
            
            # Ensure SSL certificates exist
            mkdir -p /opt/ssl/certs
            if [ -d /etc/letsencrypt/archive/ixoye.space ]; then
              cp /etc/letsencrypt/archive/ixoye.space/fullchain1.pem /opt/ssl/certs/fullchain.pem
              cp /etc/letsencrypt/archive/ixoye.space/privkey1.pem /opt/ssl/certs/privkey.pem
              cp /etc/letsencrypt/archive/ixoye.space/cert1.pem /opt/ssl/certs/cert.pem
              cp /etc/letsencrypt/archive/ixoye.space/chain1.pem /opt/ssl/certs/chain.pem
              chmod 644 /opt/ssl/certs/*.pem
              chmod 600 /opt/ssl/certs/privkey.pem
            fi
            
            # Stop old containers
            docker stop xray-reality web-server 2>/dev/null || true
            docker rm xray-reality web-server 2>/dev/null || true
            
            # Create SSL proxy service for port 443
            cat > /etc/systemd/system/ssl-proxy.service << 'PROXYEOF'
[Unit]
Description=SSL Proxy to Docker
After=network.target docker.service

[Service]
Type=simple
ExecStart=/usr/bin/socat TCP-LISTEN:443,bind=0.0.0.0,reuseaddr,fork TCP:127.0.0.1:8443
Restart=always
RestartSec=3

[Install]
WantedBy=multi-user.target
PROXYEOF
            
            systemctl daemon-reload
            systemctl enable ssl-proxy
            systemctl restart ssl-proxy || true
            
            # Start containers
            docker compose up -d --build
            
            echo "Deployment complete!"
            docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
          ENDSSH
