name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Remove git directory for clean copy
        run: rm -rf .git

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
      - name: Sync files to server
        run: |
          rsync -avz --exclude='.git' --exclude='.github' \
            -e "ssh -o StrictHostKeyChecking=no -p ${{ secrets.SSH_PORT }}" \
            ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/app/
          
      - name: Build and deploy
        run: |
          ssh -o StrictHostKeyChecking=no -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'SSHCMD'
            # Ensure SSL certificates exist
            mkdir -p /opt/ssl
            if [ -d /etc/letsencrypt/archive/ixoye.space ]; then
              cp /etc/letsencrypt/archive/ixoye.space/*.pem /opt/ssl/
            fi
            
            # Create Dockerfile
            cat > /opt/app/Dockerfile << 'DOCKEREOF'
FROM nginx:alpine

COPY . /usr/share/nginx/html
COPY nginx.conf /etc/nginx/conf.d/default.conf

RUN mkdir -p /etc/nginx/ssl

EXPOSE 80 443

CMD ["nginx", "-g", "daemon off;"]
DOCKEREOF
            
            # Create docker-compose.yml
            cat > /opt/app/docker-compose.yml << 'COMPOSEEOF'
services:
  web:
    build: .
    ports:
      - "80:80"
      - "8443:443"
    volumes:
      - /opt/ssl:/etc/nginx/ssl:ro
    restart: unless-stopped
COMPOSEEOF
            
            # Build and deploy
            cd /opt/app
            docker compose down || true
            docker compose up -d --build
            docker image prune -f
          SSHCMD
