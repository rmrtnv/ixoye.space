name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Remove git directory for clean copy
        run: rm -rf .git

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
      - name: Sync files to server
        run: |
          rsync -avz --exclude='.git' --exclude='.github' \
            -e "ssh -o StrictHostKeyChecking=no -p ${{ secrets.SSH_PORT }}" \
            ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/app/
          
      - name: Deploy with Xray Reality and Web Fallback
        run: |
          ssh -o StrictHostKeyChecking=no -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} 'bash -s' << 'ENDSSH'
            set -e
            cd /opt/app
            
            # Generate Xray Reality credentials if not exist
            if [ ! -f .env ]; then
              echo "Generating new Xray Reality credentials..."
              
              # Generate UUID
              UUID=$(cat /proc/sys/kernel/random/uuid)
              
              # Generate REALITY keypair using xray
              KEYPAIR=$(docker run --rm teddysun/xray xray api genkeypair 2>/dev/null || \
                echo "PRIVATE_KEY:placeholder PUBLIC_KEY:placeholder")
              
              PRIVATE_KEY=$(echo $KEYPAIR | grep -oP '(?<=PRIVATE_KEY:)[^ ]+' | head -1)
              PUBLIC_KEY=$(echo $KEYPAIR | grep -oP '(?<=PUBLIC_KEY:)[^ ]+' | head -1)
              
              # If xray api fails, generate using openssl
              if [ "$PRIVATE_KEY" = "placeholder" ] || [ -z "$PRIVATE_KEY" ]; then
                echo "Using openssl for key generation..."
                PRIVATE_KEY=$(openssl ecparam -genkey -name prime256v1 -noout 2>/dev/null | openssl ec -outform base64 2>/dev/null | tr -d '\n')
              fi
              
              # Generate Short ID
              SHORT_ID=$(openssl rand -hex 4)
              
              echo "UUID=$UUID" > .env
              echo "PRIVATE_KEY=$PRIVATE_KEY" >> .env
              echo "SHORT_ID=$SHORT_ID" >> .env
              echo "Credentials generated and saved to .env"
            else
              echo "Loading existing credentials from .env"
              source .env
            fi
            
            # Update Xray config with credentials
            sed -i "s/{{UUID}}/$UUID/g" xray/config.json
            sed -i "s/{{PRIVATE_KEY}}/$PRIVATE_KEY/g" xray/config.json
            sed -i "s/{{SHORT_ID}}/$SHORT_ID/g" xray/config.json
            
            # Stop existing containers
            docker compose down 2>/dev/null || true
            
            # Start services
            docker compose up -d --build
            
            # Prune old images
            docker image prune -f
            
            echo "Deployment complete!"
            docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
          ENDSSH
